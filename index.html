<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OBMC Enroll Now</title>
   

 <!-- Bootstrap CDN Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="OBML.PNG" alt="Logo" width="60" class="me-2">
            Enroll Now
        </a>
        <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="Search">
            <button class="btn btn-primary" type="submit">Search</button>
        </form>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="bg-section">
    <div class="container py-5">

        <div class="text-center text-white">
            <h1 class="fw-bold">OBMC Student Enrollment Form</h1>
            <p>Fill out the form below to enroll for the upcoming school year.</p>
        </div>

        <div class="card shadow p-4">

            <!-- STUDENT INFORMATION -->
            <h4 class="mb-3">Student Information</h4>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control" placeholder="Chester">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" placeholder="Roxas">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Birth Date</label>
                    <input type="date" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Gender</label>
                    <select class="form-control">
                        <option>Select...</option>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Grade Level</label>
                    <select class="form-control">
                        <option>Select...</option>
                        <option>Grade 1</option>
                        <option>Grade 2</option>
                        <option>Grade 3</option>
                    </select>
                </div>
            </div>

            <!-- CONTACT DETAILS -->
            <h4 class="mt-4 mb-3">Contact Details</h4>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" placeholder="student@example.com">
            </div>

            <div class="mb-3">
                <label class="form-label">Contact Number</label>
                <input type="text" class="form-control" placeholder="0912-345-6789">
            </div>

            <!-- OTHER INFORMATION -->
            <h4 class="mt-4 mb-3">Other Information</h4>
            <div class="Online">
                <input class="form-check-input" type="radio" name="mode">
                <label class="form-check-label">Online</label>
            </div>
            <div class="Face to Face mb-3">
                <input class="form-check-input" type="radio" name="mode">
                <label class="form-check-label">Face-to-Face</label>
            </div>

            <div class="confirmation">
                <input class="form-check-input" type="checkbox">
                <label class="form-check-label">
                    I confirm that the information provided is true and complete.
                </label>
            </div>

            <div class="text-center">
                <button class="btn btn-primary px-5">Submit Enrollment</button>
            </div>

        </div>

        <footer class="text-center text-white mt-4">
            <small>© 2025 Student Enrollment System | Chester Roxas 9 Section</small>
        </footer>

    </div>
</div>

</body>
</html>
